<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="26%" r="92%">
      <stop offset="0%" stop-color="#2a2150"/><stop offset="100%" stop-color="#0b0b16"/>
    </radialGradient>
    <linearGradient id="arc" x1="0.05" y1="0.9" x2="0.95" y2="0.1">
      <stop offset="0%" stop-color="#a98bff"/><stop offset="55%" stop-color="#f5c451"/><stop offset="100%" stop-color="#ffe79a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- the sweep: a single confident upward arc, centered -->
  <path d="M104 360 Q200 150 408 168" fill="none" stroke="url(#arc)"
        stroke-width="34" stroke-linecap="round"/>
  <!-- arrowhead integrated at the end of the arc, same gold as the tip -->
  <path d="M408 168 l-46 -20 18 46 z" fill="#ffe79a"/>

  <!-- digits riding the arc, larger and clearly seated on the curve -->
  <g font-family="Georgia, 'Iowan Old Style', serif" font-weight="700" fill="#f4f1ff">
    <text x="150" y="320" font-size="78" transform="rotate(-34 150 320)" text-anchor="middle">3</text>
    <text x="248" y="232" font-size="78" transform="rotate(-12 248 232)" text-anchor="middle">7</text>
    <text x="338" y="206" font-size="78" transform="rotate(6 338 206)" text-anchor="middle">9</text>
  </g>
</svg>
